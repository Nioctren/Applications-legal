<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact - Nioctren Applications</title>
  <style>
    :root { --blue: #1565C0; --border: #d9e3f0; }
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; line-height: 1.6; }
    h1, h2 { color: var(--blue); }
    a { color: var(--blue); }
    .muted { color: #666; }
    .card { border: 1px solid var(--border); border-radius: 10px; padding: 1rem; margin: 1rem 0; }  </style>
</head>
<body>
  <h1>Contact</h1>
  <p>For privacy or legal questions about a Nioctren application, open a public issue in the Applications-legal repository.</p>
  <div class="card">
    <p><a href="https://github.com/Nioctren/Applications-legal/issues/new">Open a contact issue on GitHub</a></p>
    <p class="muted">Do not include passwords, signing keys, personal data, or other confidential information in a public issue.</p>
  </div>
  <p><a href="../">Back to applications</a></p>
</body>
</html>
